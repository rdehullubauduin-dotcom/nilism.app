<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<!-- Blokkeer zoekmachines -->
<meta name="robots" content="noindex, nofollow">

<script>
  // Toegangscontrole voor nilism.app
  const SECRET_KEY = "nil_access_2026";
  const urlParams = new URLSearchParams(window.location.search);

  if (urlParams.get("key") === SECRET_KEY) {
    localStorage.setItem("app_access", "granted");
  }

  if (localStorage.getItem("app_access") !== "granted") {
    document.addEventListener("DOMContentLoaded", () => {
      document.body.innerHTML = `
        <div style="background:#fff; color:#000; height:100vh; width:100vw; display:flex; align-items:center; justify-content:center; font-family:'Courier New', Courier, monospace;">
          <p style="margin:0; font-size:14px; letter-spacing:0.05em;">nilism — native app only</p>
        </div>
      `;
    });
  }
</script>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
>

<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">

<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="nilism">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>nilism</title>

<style>
  :root {
    --bg: #ffffff;
    --fg: #000000;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: pan-y;
  }

  body {
    font-family:
      "Courier New",
      Courier,
      ui-monospace,
      SFMono-Regular,
      Menlo,
      Monaco,
      Consolas,
      monospace;
  }

  .reader {
    width: 100vw;
    height: 100dvh;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    background: #ffffff;
  }

  .reader::-webkit-scrollbar {
    display: none;
  }

  .page {
    position: relative;
    width: 100%;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    overflow: hidden;
    background: #ffffff;
  }

  .page img {
    height: 100dvh;
    width: auto;
    max-width: none;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    display: block;
  }

  @supports (height: 100svh) {
    .reader,
    .page {
      height: 100svh;
    }

    .page {
      min-height: 100svh;
    }

    .page img {
      height: 100svh;
    }
  }

  @media (display-mode: browser) {
    .page img {
      height: 110dvh;
      width: auto;
      max-width: none;
    }
  }
</style>
</head>

<body>

<main
  class="reader"
  id="reader"
  aria-label="nilism reader"
></main>

<script>
  const PAGE_COUNT = 51;
  const reader = document.getElementById("reader");

  for (let i = 1; i <= PAGE_COUNT; i++) {
    const num = String(i).padStart(3, "0");

    const section = document.createElement("section");
    section.className = "page";
    section.setAttribute("aria-label", `Page ${i}`);

    const img = document.createElement("img");
    img.src = `/pages/${num}PWA.png`;
    img.alt = `nilism page ${i}`;
    img.loading = i <= 3 ? "eager" : "lazy";
    img.decoding = "async";

    section.appendChild(img);
    reader.appendChild(section);
  }

  function pageHeight() {
    return reader.clientHeight;
  }

  function currentPage() {
    return Math.round(reader.scrollTop / pageHeight());
  }

  function go(delta) {
    const nextPage = Math.min(
      PAGE_COUNT - 1,
      Math.max(0, currentPage() + delta)
    );

    reader.scrollTo({
      top: nextPage * pageHeight(),
      behavior: "smooth"
    });
  }

  window.addEventListener("keydown", (event) => {
    if (
      event.key === "ArrowDown" ||
      event.key === "PageDown" ||
      event.key === " " ||
      event.key === "ArrowRight"
    ) {
      event.preventDefault();
      go(1);
    }

    if (
      event.key === "ArrowUp" ||
      event.key === "PageUp" ||
      event.key === "ArrowLeft"
    ) {
      event.preventDefault();
      go(-1);
    }
  });
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", async () => {
      try {
        const registration = await navigator.serviceWorker.register(
          "/sw.js",
          {
            scope: "/",
            updateViaCache: "none"
          }
        );

        await registration.update();

        let reloading = false;

        navigator.serviceWorker.addEventListener(
          "controllerchange",
          () => {
            if (reloading) return;
            reloading = true;
            window.location.reload();
          }
        );

        console.log("nilism service worker active");
      } catch (error) {
        console.error(
          "Service worker registration failed:",
          error
        );
      }
    });
  }
</script>
</body>
</html>
