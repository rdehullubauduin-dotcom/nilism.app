<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="nil-ism">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  :root { --bg: #ffffff; --fg: #000000; }
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    position: fixed;
    overflow: hidden;
    background-color: #ffffff;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  .reader {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
  }

  .page {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease-in-out;
  }

  .page.active {
    opacity: 1;
    pointer-events: auto;
  }

  .page img {
    max-width: 100vw;
    max-height: 100vh;
    max-height: 100dvh;
    width: auto;
    height: auto;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    display: block;
    margin: auto;
  }
</style>
</head>

<body>

<main class="reader" id="reader" aria-label="Book reader"></main>

<script>
  // NOODGREEP: Sloop direct elke actieve service worker en cache die de boel gijzelt
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
      for(let registration of registrations) {
        registration.unregister();
      }
    });
  }
  if ('caches' in window) {
    caches.keys().then(function(names) {
      for (let name of names) {
        caches.delete(name);
      }
    });
  }

  const reader = document.getElementById('reader');
  let bookPagesList = []; 
  let privacyPageElement = null; 
  let currentIndex = 0;
  let isViewingPrivacy = false;

  function checkIsLiveLocked() {
    const urlParams = new URLSearchParams(window.location.search);
    
    // Alleen open als de sleutel NU exact in de URL staat
    if (urlParams.get('key') === 'nil_access_2026') {
      return false; // Ontgrendeld
    }

    // In alle andere gevallen: HARD OP SLOT
    return true;
  }

  function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function generateNewBatch() {
    let batch = [];
    for (let i = 2; i <= 61; i++) {
      const padded = String(i).padStart(3, '0');
      batch.push(`${padded}PWA.png`);
    }
    return shuffleArray(batch);
  }

  let currentBatch = [];

  function getNextPageFileName() {
    if (currentBatch.length === 0) {
      currentBatch = generateNewBatch();
    }
    return currentBatch.shift();
  }

  function initReader() {
    reader.innerHTML = '';
    
    // Als hij op slot staat, tonen we ALLEEN PWA.png en stoppen we direct.
    if (checkIsLiveLocked()) {
      const section = document.createElement('section');
      section.className = 'page active';
      section.setAttribute('aria-label', 'Preview gate');

      const img = document.createElement('img');
      img.src = '/pages/PWA.png?v=2026';
      img.alt = 'Preview gate';
      img.loading = 'eager';
      img.decoding = 'async';
      
      section.appendChild(img);
      reader.appendChild(section);
      bookPagesList = [section];
      currentIndex = 0;
      return;
    }

    // Alleen bereikbaar als de URL-sleutel klopt:
    const startSection = document.createElement('section');
    startSection.className = 'page active';
    startSection.setAttribute('aria-label', 'Page 001PWA');

    const startImg = document.createElement('img');
    startImg.src = '/pages/001PWA.png';
    startImg.alt = 'Page 001PWA';
    startImg.loading = 'eager';
    startImg.decoding = 'async';
    
    startSection.appendChild(startImg);
    reader.appendChild(startSection);
    bookPagesList = [startSection];
    currentBatch = generateNewBatch();
    currentIndex = 0;

    const privacySection = document.createElement('section');
    privacySection.className = 'page';
    privacySection.setAttribute('aria-label', 'Privacy Page 000PWA');

    const privacyImg = document.createElement('img');
    privacyImg.src = '/pages/000PWA.png';
    privacyImg.alt = 'Privacy Page 000PWA';
    privacyImg.loading = 'lazy';
    privacyImg.decoding = 'async';

    privacySection.appendChild(privacyImg);
    reader.appendChild(privacySection);
    privacyPageElement = privacySection;
  }

  function addNextRandomPage() {
    const fileName = getNextPageFileName();
    let section = document.createElement('section');
    section.className = 'page';
    section.setAttribute('aria-label', `Page ${fileName}`);

    let img = document.createElement('img');
    img.src = `/pages/${fileName}`;
    img.alt = `Page ${fileName}`;
    img.loading = 'lazy';
    img.decoding = 'async';

    section.appendChild(img);
    reader.appendChild(section);
    bookPagesList.push(section);
  }

  function handlePageTurn(clientX) {
    if (checkIsLiveLocked() || !bookPagesList.length) return;

    if (isViewingPrivacy) {
      privacyPageElement.classList.remove('active');
      isViewingPrivacy = false;
      bookPagesList[currentIndex].classList.add('active');
      return;
    }

    bookPagesList[currentIndex].classList.remove('active');

    if (clientX < window.innerWidth / 2) {
      if (currentIndex > 0) {
        currentIndex--;
      }
    } else {
      currentIndex++;
      if (currentIndex >= bookPagesList.length) {
        addNextRandomPage();
      }
    }

    bookPagesList[currentIndex].classList.add('active');
  }

  let lastTapTime = 0;

  function handleInteraction(clientX) {
    if (checkIsLiveLocked()) return;

    const now = Date.now();
    const diff = now - lastTapTime;

    if (diff < 350 && diff > 0) {
      lastTapTime = 0;
      if (isViewingPrivacy) {
        privacyPageElement.classList.remove('active');
        isViewingPrivacy = false;
        bookPagesList[currentIndex].classList.add('active');
      } else {
        bookPagesList[currentIndex].classList.remove('active');
        privacyPageElement.classList.add('active');
        isViewingPrivacy = true;
      }
      return;
    }

    lastTapTime = now;
    handlePageTurn(clientX);
  }

  window.addEventListener("click", (e) => {
    handleInteraction(e.clientX);
  });

  window.addEventListener('keydown', (e) => {
    if (checkIsLiveLocked() || !bookPagesList.length) return;

    if (isViewingPrivacy) {
      privacyPageElement.classList.remove('active');
      isViewingPrivacy = false;
      bookPagesList[currentIndex].classList.add('active');
      return;
    }

    if (['ArrowRight', 'ArrowDown', ' '].includes(e.key)) {
      e.preventDefault();
      bookPagesList[currentIndex].classList.remove('active');
      currentIndex++;
      if (currentIndex >= bookPagesList.length) {
        addNextRandomPage();
      }
      bookPagesList[currentIndex].classList.add('active');
    } else if (['ArrowLeft', 'ArrowUp'].includes(e.key)) {
      e.preventDefault();
      if (currentIndex > 0) {
        bookPagesList[currentIndex].classList.remove('active');
        currentIndex--;
        bookPagesList[currentIndex].classList.add('active');
      }
    }
  });

  initReader();
</script>
</body>
</html>
