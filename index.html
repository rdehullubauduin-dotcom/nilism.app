<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">

<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="nilism">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>nilism</title>

<style>
  :root {
    --bg: #ffffff;
    --fg: #000000;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: "Courier New", Courier, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  .reader {
    width: 100vw;
    height: 100dvh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    background: #ffffff;
    -webkit-overflow-scrolling: touch;
  }

  .page {
    position: relative;
    width: 100%;
    height: 100dvh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: #ffffff;
  }

  .page img {
    height: 100dvh;
    width: auto;
    max-width: none;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    display: block;
  }

  @supports (height: 100svh) {
    .reader, .page {
      height: 100svh;
    }

    .page img {
      height: 100svh;
    }
  }

  .gate {
    position: fixed;
    inset: 0;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    padding: 24px;
    text-align: center;
  }

  .gate.hidden {
    display: none;
  }

  .gate-text {
    font-size: 14px;
    line-height: 1.6;
    letter-spacing: 0.05em;
    max-width: 400px;
  }
</style>
</head>

<body>

<div id="gate" class="gate">
  <div class="gate-text">native app only available in apple app store and google play store</div>
</div>

<main class="reader" id="reader"></main>

<script>
  // Toegangscontrole via URL-parameter of opgeslagen status
  const params = new URLSearchParams(window.location.search);
  if (params.get('key') === 'nil_access_2026') {
    localStorage.setItem('nil_access', 'true');
  }

  const hasAccess = localStorage.getItem('nil_access') === 'true';
  const gate = document.getElementById('gate');
  const reader = document.getElementById('reader');

  if (hasAccess) {
    gate.classList.add('hidden');
    initReader();
  }

  function initReader() {
    const totalPages = 48; 
    
    for (let i = 1; i <= totalPages; i++) {
      const num = String(i).padStart(3, '0');
      const section = document.createElement('section');
      section.className = 'page';
      section.id = `page-${i}`;
      
      const img = document.createElement('img');
      img.src = `/pages/${num}PWA.png`;
      img.alt = `nilism ${num}`;
      img.loading = i <= 2 ? 'eager' : 'lazy';
      img.decoding = 'async';
      
      section.appendChild(img);
      reader.appendChild(section);
    }
  }

  // Cursor / Pijltoetsen navigatie voor desktop & 'r' voor willekeurige pagina
  window.addEventListener('keydown', (e) => {
    if (!hasAccess) return;
    
    const pages = document.querySelectorAll('.page');
    if (!pages.length) return;

    let currentIndex = Math.round(reader.scrollTop / window.innerHeight);

    if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') {
      e.preventDefault();
      currentIndex = Math.min(currentIndex + 1, pages.length - 1);
      pages[currentIndex].scrollIntoView({ behavior: 'smooth' });
    } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
      e.preventDefault();
      currentIndex = Math.max(currentIndex - 1, 0);
      pages[currentIndex].scrollIntoView({ behavior: 'smooth' });
    } else if (e.key.toLowerCase() === 'r') {
      e.preventDefault();
      const randomPage = Math.floor(Math.random() * pages.length);
      pages[randomPage].scrollIntoView({ behavior: 'smooth' });
    }
  });

  // Geheime actie: 3x snel tikken op het scherm opent /privacy
  let tapCount = 0;
  let tapTimer = null;

  document.addEventListener("pointerdown", function () {
    tapCount++;
    clearTimeout(tapTimer);

    if (tapCount >= 3) {
      tapCount = 0;
      window.location.href = "/privacy";
    } else {
      tapTimer = setTimeout(function () {
        tapCount = 0;
      }, 1000);
    }
  });

  // Service Worker registratie
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
