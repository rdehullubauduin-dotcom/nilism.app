<script>
  // Geheime actie: 3 keer snel tikken op het scherm opent /privacy
  let tapCount = 0;
  let tapTimer;

  window.addEventListener("click", () => {
    tapCount++;
    clearTimeout(tapTimer);

    if (tapCount >= 3) {
      tapCount = 0;
      window.location.href = "/privacy";
    } else {
      tapTimer = setTimeout(() => {
        tapCount = 0;
      }, 1000); // Reset als er 1 seconde niet getikt wordt
    }
  });
</script>
