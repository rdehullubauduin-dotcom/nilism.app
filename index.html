<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>nilism</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="nilism">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  :root { --bg: #ffffff; --fg: #000000; }
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
    user-select: none;
    -webkit-user-select: none;
  }

  .reader {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
  }

  .page {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease-in-out;
  }

  .page.active {
    opacity: 1;
    pointer-events: auto;
  }

  .page img {
    max-width: 110vw;
    max-height: 110dvh;
    width: auto;
    height: auto;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    display: block;
    margin: auto;
    margin-top: -4vh;
  }

  @supports (height: 100svh) {
    .page { height: 100svh; }
    .page img { max-height: 100svh; }
  }

  @media (display-mode: browser) {
    .page img {
      max-height: 100dvh;
    }
  }
</style>
</head>

<body>

<main class="reader" id="reader" aria-label="Book reader"></main>

<script>
  const reader = document.getElementById('reader');
  let pages = [];
  let currentIndex = 0;
  let hasAccess = localStorage.getItem('nilism_access') === 'true';

  function getPageSrc(num) {
    const padded = String(num).padStart(3, '0');
    return `/pages/${padded}.png`;
  }

  async function checkPageExists(num) {
    try {
      const res = await fetch(getPageSrc(num), { method: 'HEAD' });
      return res.ok;
    } catch {
      return false;
    }
  }

  async function initReader() {
    reader.innerHTML = '';
    let tempPages = [];

    // Als je GEEN access hebt, zie je enkel PWA.png als preview gate
    if (!hasAccess) {
      tempPages.push({ src: '/pages/PWA.png', alt: 'Preview gate', isGift: false });
    } else {
      // Als je WEL access hebt, laadt het normale boek (Pagina 1 + geschudde pagina's 2 t/m 150)
      tempPages.push({ src: getPageSrc(1), alt: 'Page 1', isGift: false });

      const maxCheck = 150;
      const promises = [];
      for (let i = 2; i <= maxCheck; i++) {
        promises.push(checkPageExists(i).then(exists => exists ? i : null));
      }

      const results = await Promise.all(promises);
      let availablePages = results.filter(num => num !== null);

      for (let j = availablePages.length - 1; j > 0; j--) {
        const rand = Math.floor(Math.random() * (j + 1));
        [availablePages[j], availablePages[rand]] = [availablePages[rand], availablePages[j]];
      }

      availablePages.forEach((pageNumber) => {
        tempPages.push({
          src: getPageSrc(pageNumber),
          alt: `Page ${pageNumber}`,
          isGift: false
        });
      });
    }

    // 000PWA.png komt altijd als de absolute laatste pagina, bereikbaar via de lange druk van 2 seconden
    tempPages.push({
      src: '/pages/000PWA.png',
      alt: 'Privacy Page',
      isGift: false
    });

    // Render alle pagina's naar de DOM
    tempPages.forEach((pData, idx) => {
      const section = document.createElement('section');
      section.className = 'page' + (idx === 0 ? ' active' : '');
      section.id = `page-${idx + 1}`;
      section.setAttribute('aria-label', pData.alt);

      const img = document.createElement('img');
      img.src = pData.src;
      img.alt = pData.alt;
      img.loading = idx < 3 ? 'eager' : 'lazy';
      img.decoding = 'async';
      
      section.appendChild(img);
      reader.appendChild(section);
    });

    pages = document.querySelectorAll('.page');
    currentIndex = 0;
  }

  // Bladerlogica via normale klikken / tikken (werkt alleen als er meerdere pagina's zijn, of om te sluiten)
  document.addEventListener("click", (e) => {
    if (e.target.closest('.gift-link')) return;
    if (!pages.length) return;

    // Als je op de privacy-pagina (laatste pagina) staat en klikt, ga je weer terug naar de startpagina
    if (currentIndex === pages.length - 1) {
      pages[currentIndex].classList.remove('active');
      currentIndex = 0;
      pages[currentIndex].classList.add('active');
      return;
    }

    pages[currentIndex].classList.remove('active');
    currentIndex = (currentIndex + 1) % pages.length;
    pages[currentIndex].classList.add('active');
  });

  // 2 seconden ingedrukt houden om naar 000PWA.png te springen
  let pressTimer = null;

  document.addEventListener("pointerdown", function (e) {
    if (e.target.closest('.gift-link')) return;
    clearTimeout(pressTimer);

    pressTimer = setTimeout(() => {
      if (!pages.length) return;
      pages[currentIndex].classList.remove('active');
      currentIndex = pages.length - 1; // Spring direct naar 000PWA.png
      pages[currentIndex].classList.add('active');
    }, 2000); // 2000 milliseconden = 2 seconden
  });

  document.addEventListener("pointermove", () => clearTimeout(pressTimer));
  document.addEventListener("pointerup", () => clearTimeout(pressTimer));

  // Toetsenbordondersteuning
  window.addEventListener('keydown', (e) => {
    if (!pages.length) return;
    if (['ArrowRight', 'ArrowDown', ' '].includes(e.key)) {
      e.preventDefault();
      if (currentIndex === pages.length - 1) {
        currentIndex = 0;
      } else {
        pages[currentIndex].classList.remove('active');
        currentIndex = (currentIndex + 1) % pages.length;
      }
      pages[currentIndex].classList.add('active');
    } else if (['ArrowLeft', 'ArrowUp'].includes(e.key)) {
      e.preventDefault();
      pages[currentIndex].classList.remove('active');
      currentIndex = (currentIndex - 1 + pages.length) % pages.length;
      pages[currentIndex].classList.add('active');
    }
  });

  initReader();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
