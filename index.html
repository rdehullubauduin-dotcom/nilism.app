<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recenter.ing">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  :root { --bg: #ffffff; --fg: #000000; }
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: pan-y;
  }

  .reader {
    width: 100vw;
    height: 100dvh;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    background: #fff;
  }

  .reader::-webkit-scrollbar { display: none; }

  .page {
    position: relative;
    width: 100%;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    overflow: hidden;
    background: #fff;
  }

  .page img {
    height: 100dvh;
    width: auto;
    max-width: none;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    display: block;
  }

  .gift-link {
    position: absolute;
    left: 35%;
    width: 30%;
    top: 44%;
    height: 30%;
    z-index: 999;
    display: block;
  }

  .gate {
    position: fixed;
    inset: 0;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    padding: 24px;
    text-align: center;
  }

  .gate.hidden {
    display: none;
  }

  .gate-text {
    font-family: "Courier New", Courier, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 14px;
    line-height: 1.6;
    letter-spacing: 0.05em;
    max-width: 400px;
    color: #000000;
  }

  @supports (height: 100svh) {
    .reader, .page { height: 100svh; }
    .page img { height: 100svh; }
  }

  @media (display-mode: browser) {
    .page img {
      height: 110dvh;
      width: auto;
      max-width: none;
    }
  }
</style>
</head>

<body>

<div id="gate" class="gate">
  <div class="gate-text">native app only available in apple app store and google play store</div>
</div>

<main class="reader" id="reader" aria-label="Recenter.ing full reader"></main>

<script>
  // Toegangscontrole via URL-parameter of opgeslagen status
  const params = new URLSearchParams(window.location.search);
  if (params.get('key') === 'nil_access_2026') {
    localStorage.setItem('nil_access', 'true');
  }

  const hasAccess = localStorage.getItem('nil_access') === 'true';
  const gate = document.getElementById('gate');
  const reader = document.getElementById('reader');

  if (hasAccess) {
    gate.classList.add('hidden');
    initReader();
  }

  const PAGE_COUNT = 48; 
  const GIFT_PAGE = PAGE_COUNT;
  const GIFT_LINK = "https://buy.stripe.com/00weVc0UU2jj3KU4rq28801";

  function initReader() {
    for (let i = 1; i <= PAGE_COUNT; i++) {
      const num = String(i).padStart(3, '0');

      const section = document.createElement('section');
      section.className = 'page';
      section.id = `page-${i}`;
      section.setAttribute('aria-label', `Page ${i}`);

      const img = document.createElement('img');
      img.src = `/pages/${num}PWA.png`;
      img.alt = `Recenter.ing page ${i}`;
      img.loading = i <= 3 ? 'eager' : 'lazy';
      img.decoding = 'async';
      
      section.appendChild(img);

      if (i === GIFT_PAGE) {
        const link = document.createElement('a');
        link.href = GIFT_LINK;
        link.className = 'gift-link';
        link.setAttribute('aria-label', 'Share Recenter.ing as a friend gift');
        section.appendChild(link);
      }

      reader.appendChild(section);
    }
  }

  function getPages() {
    return document.querySelectorAll('.page');
  }

  function getCurrentIndex() {
    const pages = getPages();
    if (!pages.length) return 0;
    const scrollTop = reader.scrollTop;
    let closestIndex = 0;
    let minDistance = Infinity;

    pages.forEach((page, index) => {
      const distance = Math.abs(page.offsetTop - scrollTop);
      if (distance < minDistance) {
        minDistance = distance;
        closestIndex = index;
      }
    });
    return closestIndex;
  }

  function go(delta) {
    const pages = getPages();
    if (!pages.length) return;
    const nextIndex = Math.min(pages.length - 1, Math.max(0, getCurrentIndex() + delta));
    pages[nextIndex].scrollIntoView({ behavior: 'smooth' });
  }

  // Toetsenbordnavigatie inclusief 'r' voor een willekeurige pagina en 3x tikken naar /privacy
  window.addEventListener('keydown', (e) => {
    if (!hasAccess) return;
    const pages = getPages();
    if (!pages.length) return;

    if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ' || e.key === 'ArrowRight') {
      e.preventDefault();
      go(1);
    } else if (e.key === 'ArrowUp' || e.key === 'PageUp' || e.key === 'ArrowLeft') {
      e.preventDefault();
      go(-1);
    } else if (e.key.toLowerCase() === 'r') {
      e.preventDefault();
      const randomIndex = Math.floor(Math.random() * pages.length);
      pages[randomIndex].scrollIntoView({ behavior: 'smooth' });
    }
  });

  // Geheime actie: 3x snel tikken op het scherm opent /privacy
  let tapCount = 0;
  let tapTimer = null;

  document.addEventListener("pointerdown", function () {
    tapCount++;
    clearTimeout(tapTimer);

    if (tapCount >= 3) {
      tapCount = 0;
      window.location.href = "/privacy";
    } else {
      tapTimer = setTimeout(function () {
        tapCount = 0;
      }, 1000);
    }
  });

  // Service Worker registratie
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
