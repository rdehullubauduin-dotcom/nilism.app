<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>nilism</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="nilism">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  :root { --bg: #ffffff; --fg: #000000; }
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  .reader {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
  }

  .page {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease-in-out;
  }

  .page.active {
    opacity: 1;
    pointer-events: auto;
  }

  .page img {
    /* Perfect gebalanceerde zoom: net iets groter dan passend zonder dat het scherm uit knalt */
    max-width: 104vw;
    max-height: 104dvh;
    width: auto;
    height: auto;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    display: block;
    margin: auto;
  }
</style>
</head>

<body>

<main class="reader" id="reader" aria-label="Book reader"></main>

<script>
  const reader = document.getElementById('reader');
  let pages = [];
  let currentIndex = 0;

  function initReader() {
    reader.innerHTML = '';
    let tempPages = [];

    const hostname = window.location.hostname;
    const isLiveDomain = hostname === 'nilism.app' || hostname === 'www.nilism.app';

    if (isLiveDomain) {
      tempPages.push({ src: '/pages/PWA.png', alt: 'Preview gate' });
    } else {
      tempPages.push({ src: '/pages/001PWA.png', alt: 'Page 001PWA' });

      let bookPages = [];
      for (let i = 2; i <= 51; i++) {
        const padded = String(i).padStart(3, '0');
        bookPages.push(`${padded}PWA.png`);
      }

      for (let j = bookPages.length - 1; j > 0; j--) {
        const rand = Math.floor(Math.random() * (j + 1));
        [bookPages[j], bookPages[rand]] = [bookPages[rand], bookPages[j]];
      }

      bookPages.forEach((fileName) => {
        tempPages.push({
          src: `/pages/${fileName}`,
          alt: `Page ${fileName}`
        });
      });
    }

    tempPages.push({
      src: '/pages/000PWA.png',
      alt: 'Privacy Page'
    });

    tempPages.forEach((pData, idx) => {
      const section = document.createElement('section');
      section.className = 'page' + (idx === 0 ? ' active' : '');
      section.setAttribute('aria-label', pData.alt);

      const img = document.createElement('img');
      img.src = pData.src;
      img.alt = pData.alt;
      img.loading = idx < 3 ? 'eager' : 'lazy';
      img.decoding = 'async';
      
      section.appendChild(img);
      reader.appendChild(section);
    });

    pages = document.querySelectorAll('.page');
    currentIndex = 0;
  }

  // Kliklogica: links = achteruit, rechts = vooruit
  window.addEventListener("click", (e) => {
    if (e.target.closest('.gift-link')) return;
    if (!pages.length) return;

    pages[currentIndex].classList.remove('active');

    if (e.clientX < window.innerWidth / 2) {
      currentIndex = (currentIndex - 1 + pages.length) % pages.length;
    } else {
      currentIndex = (currentIndex + 1) % pages.length;
    }

    pages[currentIndex].classList.add('active');
  });

  // Robuuste 2-seconden timer voor de privacy-pagina (000PWA.png)
  let pressTimer = null;
  let isLongPressTriggered = false;

  window.addEventListener("pointerdown", (e) => {
    if (e.target.closest('.gift-link')) return;
    isLongPressTriggered = false;
    clearTimeout(pressTimer);

    pressTimer = setTimeout(() => {
      if (!pages.length) return;
      isLongPressTriggered = true;
      pages[currentIndex].classList.remove('active');
      currentIndex = pages.length - 1; // Direct naar de laatste pagina (000PWA.png)
      pages[currentIndex].classList.add('active');
    }, 2000);
  });

  window.addEventListener("pointermove", () => {
    clearTimeout(pressTimer);
  });

  window.addEventListener("pointerup", () => {
    clearTimeout(pressTimer);
  });

  // Voorkom dat een lange druk ook direct een normale klik activeert
  window.addEventListener("click", (e) => {
    if (isLongPressTriggered) {
      e.stopImmediatePropagation();
      isLongPressTriggered = false;
    }
  }, true);

  // Toetsenbord ondersteuning
  window.addEventListener('keydown', (e) => {
    if (!pages.length) return;
    if (['ArrowRight', 'ArrowDown', ' '].includes(e.key)) {
      e.preventDefault();
      pages[currentIndex].classList.remove('active');
      currentIndex = (currentIndex + 1) % pages.length;
      pages[currentIndex].classList.add('active');
    } else if (['ArrowLeft', 'ArrowUp'].includes(e.key)) {
      e.preventDefault();
      pages[currentIndex].classList.remove('active');
      currentIndex = (currentIndex - 1 + pages.length) % pages.length;
      pages[currentIndex].classList.add('active');
    }
  });

  initReader();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
