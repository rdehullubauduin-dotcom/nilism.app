<script>
  const TOTAL_PAGES = 51;
  const reader = document.getElementById("reader");

  // 1. Maak een array [2, 3, ..., 51]
  const remaining = [];
  for (let i = 2; i <= TOTAL_PAGES; i++) {
    remaining.push(i);
  }

  // 2. Schud de lijst grondig (Fisher-Yates Shuffle)
  for (let i = remaining.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const temp = remaining[i];
    remaining[i] = remaining[j];
    remaining[j] = temp;
  }

  // 3. Pagina 1 staat altijd voorop, de rest volgt direct willekeurig
  const pageOrder = [1, ...remaining];

  // 4. Bouw de DOM-elementen op
  pageOrder.forEach((pageNum, index) => {
    const num = String(pageNum).padStart(3, "0");

    const section = document.createElement("section");
    section.className = "page";
    section.setAttribute("aria-label", `Page ${pageNum}`);

    const img = document.createElement("img");
    img.src = `/pages/${num}PWA.png`;
    img.alt = `nilism page ${pageNum}`;
    
    // Alleen de allereerste pagina eager laden, de rest lazy
    img.loading = index === 0 ? "eager" : "lazy";
    img.decoding = "async";

    section.appendChild(img);
    reader.appendChild(section);
  });

  function pageHeight() {
    return reader.clientHeight;
  }

  function currentPage() {
    return Math.round(reader.scrollTop / pageHeight());
  }

  function go(delta) {
    const nextPage = Math.min(
      TOTAL_PAGES - 1,
      Math.max(0, currentPage() + delta)
    );

    reader.scrollTo({
      top: nextPage * pageHeight(),
      behavior: "smooth"
    });
  }

  window.addEventListener("keydown", (event) => {
    if (
      event.key === "ArrowDown" ||
      event.key === "PageDown" ||
      event.key === " " ||
      event.key === "ArrowRight"
    ) {
      event.preventDefault();
      go(1);
    }

    if (
      event.key === "ArrowUp" ||
      event.key === "PageUp" ||
      event.key === "ArrowLeft"
    ) {
      event.preventDefault();
      go(-1);
    }
  });
</script>
