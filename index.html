<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recenter.ing">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  :root { --bg: #ffffff; --fg: #000000; }
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
  }

  .reader {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
  }

  .page {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease-in-out;
  }

  .page.active {
    opacity: 1;
    pointer-events: auto;
  }

  .page img {
    max-width: 110vw;
    max-height: 110dvh;
    width: auto;
    height: auto;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    display: block;
    margin: auto;
  }

  .gift-link {
    position: absolute;
    left: 35%;
    width: 30%;
    top: 44%;
    height: 30%;
    z-index: 999;
    display: block;
  }

  @supports (height: 100svh) {
    .page { height: 100svh; }
    .page img { max-height: 110svh; }
  }

  @media (display-mode: browser) {
    .page img {
      max-height: 110dvh;
    }
  }
</style>
</head>

<body>

<main class="reader" id="reader" aria-label="Recenter.ing reader"></main>

<script>
  const params = new URLSearchParams(window.location.search);
  if (params.get('key') === 'nil_access_2026') {
    localStorage.setItem('nil_access', 'true');
  }

  const hasAccess = localStorage.getItem('nil_access') === 'true';
  const reader = document.getElementById('reader');
  const GIFT_LINK = "https://buy.stripe.com/00weVc0UU2jj3KU4rq28801";
  
  let pages = [];
  let currentIndex = 0;

  async function checkPageExists(pageNumber) {
    const num = String(pageNumber).padStart(3, '0');
    try {
      const response = await fetch(`/pages/${num}PWA.png`, { method: 'HEAD' });
      return response.ok;
    } catch {
      return false;
    }
  }

  async function initReader() {
    reader.innerHTML = '';
    
    // 1. Bouw direct de startpagina's op
    let tempPages = [];
    if (!hasAccess) {
      tempPages.push({ src: '/pages/PWA.png', alt: 'Recenter.ing preview gate', isGift: false });
    }
    tempPages.push({ src: getPageSrc(1), alt: 'Page 1', isGift: false });

    // 2. Controleer pagina's 2 tot 150 parallel
    const maxCheck = 150;
    const promises = [];
    for (let i = 2; i <= maxCheck; i++) {
      promises.push(
        checkPageExists(i).then(exists => exists ? i : null)
      );
    }

    const results = await Promise.all(promises);
    let availablePages = results.filter(num => num !== null);

    // 3. Schud de resterende pagina's willekeurig door elkaar
    for (let j = availablePages.length - 1; j > 0; j--) {
      const rand = Math.floor(Math.random() * (j + 1));
      [availablePages[j], availablePages[rand]] = [availablePages[rand], availablePages[j]];
    }

    // 4. Voeg toe aan de array
    availablePages.forEach((pageNumber, index) => {
      const isLast = (index === availablePages.length - 1);
      tempPages.push({
        src: getPageSrc(pageNumber),
        alt: `Page ${pageNumber}`,
        isGift: isLast
      });
    });

    // 5. Render elementen in DOM
    tempPages.forEach((pData, idx) => {
      const section = document.createElement('section');
      section.className = 'page' + (idx === 0 ? ' active' : '');
      section.id = `page-${idx + 1}`;
      section.setAttribute('aria-label', pData.alt);

      const img = document.createElement('img');
      img.src = pData.src;
      img.alt = pData.alt;
      img.loading = idx < 3 ? 'eager' : 'lazy';
      img.decoding = 'async';
      
      section.appendChild(img);

      if (pData.isGift) {
        const link = document.createElement('a');
        link.href = GIFT_LINK;
        link.className = 'gift-link';
        link.setAttribute('aria-label', 'Share Recenter.ing as a friend gift');
        section.appendChild(link);
      }

      reader.appendChild(section);
    });

    pages = document.querySelectorAll('.page');
    currentIndex = 0;
  }

  function getPageSrc(pageNumber) {
    const num = String(pageNumber).padStart(3, '0');
    return `/pages/${num}PWA.png`;
  }

  function showNextPage() {
    if (!pages.length) return;
    pages[currentIndex].classList.remove('active');
    currentIndex = (currentIndex + 1) % pages.length;
    pages[currentIndex].classList.add('active');
  }

  // Navigatie via 1x aantikken (of klikken) op het scherm
  document.addEventListener("click", function (e) {
    // Negeer als er op de gift link wordt geklikt
    if (e.target.closest('.gift-link')) return;
    showNextPage();
  });

  // Toetsenbord ondersteuning (spatie / pijl omlaag / rechts voor volgende pagina)
  window.addEventListener('keydown', (e) => {
    if (['ArrowDown', 'PageDown', ' ', 'ArrowRight'].includes(e.key)) {
      e.preventDefault();
      showNextPage();
    } else if (e.key.toLowerCase() === 'r' && pages.length) {
      e.preventDefault();
      pages[currentIndex].classList.remove('active');
      currentIndex = Math.floor(Math.random() * pages.length);
      pages[currentIndex].classList.add('active');
    }
  });

  // Privacy page via exact 3x aantikken binnen 1,2 seconde
  let tapCount = 0;
  let tapTimer = null;

  document.addEventListener("pointerdown", function (e) {
    if (e.target.closest('.gift-link')) return;
    
    tapCount++;
    clearTimeout(tapTimer);

    if (tapCount >= 3) {
      tapCount = 0;
      window.location.href = "/privacy";
    } else {
      tapTimer = setTimeout(function () {
        tapCount = 0;
      }, 1200);
    }
  });

  initReader();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
