<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>nilism</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="nilism">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  :root { --bg: #ffffff; --fg: #000000; }
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  .reader {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
  }

  .page {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease-in-out;
  }

  .page.active {
    opacity: 1;
    pointer-events: auto;
  }

  .page img {
    max-width: 112vw;
    max-height: 112dvh;
    width: auto;
    height: auto;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    display: block;
    margin: auto;
    margin-top: -3vh;
  }
</style>
</head>

<body>

<main class="reader" id="reader" aria-label="Book reader"></main>

<script>
  const reader = document.getElementById('reader');
  let bookPagesList = []; // Bevat de oneindige/willekeurige stroom
  let privacyPageElement = null; // De vaste 000PWA.png pagina
  let currentIndex = 0;
  let previousIndex = 0;
  let isViewingPrivacy = false;

  function getRandomPageFileName() {
    // Genereer willekeurig een getal van 2 t/m 51
    const randNum = Math.floor(Math.random() * 50) + 2;
    const padded = String(randNum).padStart(3, '0');
    return `${padded}PWA.png`;
  }

  function initReader() {
    reader.innerHTML = '';
    
    const hostname = window.location.hostname;
    const isLiveDomain = hostname === 'nilism.app' || hostname === 'www.nilism.app';

    if (isLiveDomain) {
      // Op de live domein tonen we alleen de PWA preview gate
      const section = document.createElement('section');
      section.className = 'page active';
      section.setAttribute('aria-label', 'Preview gate');

      const img = document.createElement('img');
      img.src = '/pages/PWA.png';
      img.alt = 'Preview gate';
      img.loading = 'eager';
      img.decoding = 'async';
      
      section.appendChild(img);
      reader.appendChild(section);
      bookPagesList = [section];
      currentIndex = 0;
      return;
    }

    // 1. Maak de vaste startpagina: 001PWA.png
    const startSection = document.createElement('section');
    startSection.className = 'page active';
    startSection.setAttribute('aria-label', 'Page 001PWA');

    const startImg = document.createElement('img');
    startImg.src = '/pages/001PWA.png';
    startImg.alt = 'Page 001PWA';
    startImg.loading = 'eager';
    startImg.decoding = 'async';
    
    startSection.appendChild(startImg);
    reader.appendChild(startSection);
    bookPagesList = [startSection];

    // 2. Maak de privacy-pagina: 000PWA.png (zit los van de normale stroom)
    const privacySection = document.createElement('section');
    privacySection.className = 'page';
    privacySection.setAttribute('aria-label', 'Privacy Page 000PWA');

    const privacyImg = document.createElement('img');
    privacyImg.src = '/pages/000PWA.png';
    privacyImg.alt = 'Privacy Page 000PWA';
    privacyImg.loading = 'lazy';
    privacyImg.decoding = 'async';

    privacySection.appendChild(privacyImg);
    reader.appendChild(privacySection);
    privacyPageElement = privacySection;

    currentIndex = 0;
  }

  // Functie om dynamisch een nieuwe willekeurige pagina toe te voegen aan de lijst als je naar rechts klikt
  function addNextRandomPage() {
    const fileName = getRandomPageFileName();
    const section = document.createElement('section');
    section.className = 'page';
    section.setAttribute('aria-label', `Page ${fileName}`);

    const img = document.createElement('img');
    img.src = `/pages/${fileName}`;
    img.alt = `Page ${fileName}`;
    img.loading = 'lazy';
    img.decoding = 'async';

    section.appendChild(img);
    reader.appendChild(section);
    bookPagesList.push(section);
  }

  // Kliklogica: dubbele tik voor privacy, anders links/rechts bladeren
  let lastClickTime = 0;

  window.addEventListener("click", (e) => {
    if (e.target.closest('.gift-link')) return;
    if (!bookPagesList.length) return;

    const hostname = window.location.hostname;
    if (hostname === 'nilism.app' || hostname === 'www.nilism.app') return;

    const currentTime = new Date().getTime();
    const timeDiff = currentTime - lastClickTime;

    // Dubbele tik activeert/deactiveert de privacy-pagina (000PWA.png)
    if (timeDiff < 300 && timeDiff > 0) {
      if (isViewingPrivacy) {
        // Terug naar waar je gebleven was
        privacyPageElement.classList.remove('active');
        currentIndex = previousIndex;
        bookPagesList[currentIndex].classList.add('active');
        isViewingPrivacy = false;
      } else {
        // Sla huidige index op en spring naar privacy
        previousIndex = currentIndex;
        if (!isViewingPrivacy) {
          bookPagesList[currentIndex].classList.remove('active');
        }
        privacyPageElement.classList.add('active');
        isViewingPrivacy = true;
      }
      lastClickTime = 0;
      return;
    }

    lastClickTime = currentTime;

    // Als we naar privacy kijken, sluit privacy dan bij een normale klik
    if (isViewingPrivacy) {
      privacyPageElement.classList.remove('active');
      currentIndex = previousIndex;
      bookPagesList[currentIndex].classList.add('active');
      isViewingPrivacy = false;
      return;
    }

    // Normaal bladeren
    bookPagesList[currentIndex].classList.remove('active');

    if (e.clientX < window.innerWidth / 2) {
      // Linkerkant geklikt -> ga naar vorig (minimum is index 0, je kunt niet voorbij 001PWA.png terug)
      if (currentIndex > 0) {
        currentIndex--;
      }
    } else {
      // Rechterkant geklikt -> ga naar volgende
      currentIndex++;
      // Als we op het punt komen dat nog niet bestaat in de willekeurige stroom, genereer een nieuwe willekeurige pagina
      if (currentIndex >= bookPagesList.length) {
        addNextRandomPage();
      }
    }

    bookPagesList[currentIndex].classList.add('active');
  });

  // Toetsenbord ondersteuning
  window.addEventListener('keydown', (e) => {
    if (!bookPagesList.length) return;
    const hostname = window.location.hostname;
    if (hostname === 'nilism.app' || hostname === 'www.nilism.app') return;

    if (isViewingPrivacy) {
      privacyPageElement.classList.remove('active');
      currentIndex = previousIndex;
      bookPagesList[currentIndex].classList.add('active');
      isViewingPrivacy = false;
      return;
    }

    if (['ArrowRight', 'ArrowDown', ' '].includes(e.key)) {
      e.preventDefault();
      bookPagesList[currentIndex].classList.remove('active');
      currentIndex++;
      if (currentIndex >= bookPagesList.length) {
        addNextRandomPage();
      }
      bookPagesList[currentIndex].classList.add('active');
    } else if (['ArrowLeft', 'ArrowUp'].includes(e.key)) {
      e.preventDefault();
      if (currentIndex > 0) {
        bookPagesList[currentIndex].classList.remove('active');
        currentIndex--;
        bookPagesList[currentIndex].classList.add('active');
      }
    }
  });

  initReader();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
