<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>nilism</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="nilism">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  :root { --bg: #ffffff; --fg: #000000; }
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
    user-select: none;
    -webkit-user-select: none;
  }

  .reader {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
  }

  .page {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease-in-out;
  }

  .page.active {
    opacity: 1;
    pointer-events: auto;
  }

  .page img {
    max-width: 110vw;
    max-height: 110dvh;
    width: auto;
    height: auto;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    display: block;
    margin: auto;
    margin-top: -4vh;
  }

  @supports (height: 100svh) {
    .page { height: 100svh; }
    .page img { max-height: 100svh; }
  }

  @media (display-mode: browser) {
    .page img {
      max-height: 100dvh;
    }
  }
</style>
</head>

<body>

<main class="reader" id="reader" aria-label="Book reader"></main>

<script>
  const reader = document.getElementById('reader');
  let pages = [];
  let currentIndex = 0;

  function getPageSrc(num) {
    const padded = String(num).padStart(3, '0');
    return `/pages/${padded}.png`;
  }

  function initReader() {
    reader.innerHTML = '';
    let tempPages = [];

    const hostname = window.location.hostname;
    const urlParams = new URLSearchParams(window.location.search);
    
    // Controleer of we op de live domeinnaam zitten (zonder geldige URL-sleutel)
    const isLiveDomain = hostname === 'nilism.app' || hostname === 'www.nilism.app';
    const hasKey = urlParams.get('key') === 'nil_access_2026';

    if (isLiveDomain && !hasKey) {
      // Live domein zonder key toont enkel PWA.png
      tempPages.push({ src: '/pages/PWA.png', alt: 'Preview gate' });
    } else {
      // Vercel of live domein MET de juiste key toont het hele boek (Pagina 1 t/m 54)
      tempPages.push({ src: getPageSrc(1), alt: 'Page 1' });
      for (let i = 2; i <= 54; i++) {
        tempPages.push({ src: getPageSrc(i), alt: `Page ${i}` });
      }
    }

    // 000PWA.png komt altijd als absolute uitsmijter voor de lange druk van 2 seconden
    tempPages.push({
      src: '/pages/000PWA.png',
      alt: 'Privacy Page'
    });

    // Render alles naar de DOM
    tempPages.forEach((pData, idx) => {
      const section = document.createElement('section');
      section.className = 'page' + (idx === 0 ? ' active' : '');
      section.setAttribute('aria-label', pData.alt);

      const img = document.createElement('img');
      img.src = pData.src;
      img.alt = pData.alt;
      img.loading = idx < 3 ? 'eager' : 'lazy';
      img.decoding = 'async';
      
      section.appendChild(img);
      reader.appendChild(section);
    });

    pages = document.querySelectorAll('.page');
    currentIndex = 0;
  }

  // Normaal bladeren via klikken
  document.addEventListener("click", (e) => {
    if (e.target.closest('.gift-link')) return;
    if (!pages.length) return;

    pages[currentIndex].classList.remove('active');
    currentIndex = (currentIndex + 1) % pages.length;
    pages[currentIndex].classList.add('active');
  });

  // 2 seconden ingedrukt houden om direct naar 000PWA.png te springen
  let pressTimer = null;

  document.addEventListener("pointerdown", function (e) {
    if (e.target.closest('.gift-link')) return;
    clearTimeout(pressTimer);

    pressTimer = setTimeout(() => {
      if (!pages.length) return;
      pages[currentIndex].classList.remove('active');
      currentIndex = pages.length - 1; // Spring direct naar de laatste pagina (000PWA.png)
      pages[currentIndex].classList.add('active');
    }, 2000);
  });

  document.addEventListener("pointermove", () => clearTimeout(pressTimer));
  document.addEventListener("pointerup", () => clearTimeout(pressTimer));

  // Toetsenbord ondersteuning
  window.addEventListener('keydown', (e) => {
    if (!pages.length) return;
    if (['ArrowRight', 'ArrowDown', ' '].includes(e.key)) {
      e.preventDefault();
      pages[currentIndex].classList.remove('active');
      currentIndex = (currentIndex + 1) % pages.length;
      pages[currentIndex].classList.add('active');
    } else if (['ArrowLeft', 'ArrowUp'].includes(e.key)) {
      e.preventDefault();
      pages[currentIndex].classList.remove('active');
      currentIndex = (currentIndex - 1 + pages.length) % pages.length;
      pages[currentIndex].classList.add('active');
    }
  });

  initReader();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
