<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recenter.ing">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  :root { --bg: #ffffff; --fg: #000000; }
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: pan-y;
  }

  .reader {
    width: 100vw;
    height: 100dvh;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    background: #fff;
  }

  .reader::-webkit-scrollbar { display: none; }

  .page {
    position: relative;
    width: 100%;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    overflow: hidden;
    background: #fff;
  }

  .page img {
    height: 100dvh;
    width: auto;
    max-width: none;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    display: block;
  }

  .gift-link {
    position: absolute;
    left: 35%;
    width: 30%;
    top: 44%;
    height: 30%;
    z-index: 999;
    display: block;
  }

  .gate {
    position: fixed;
    inset: 0;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    overflow: hidden;
  }

  .gate.hidden {
    display: none;
  }

  .gate img {
    height: 100dvh;
    width: auto;
    max-width: none;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    display: block;
  }

  @supports (height: 100svh) {
    .reader, .page, .gate { height: 100svh; }
    .page img, .gate img { height: 100svh; }
  }

  @media (display-mode: browser) {
    .page img, .gate img {
      height: 110dvh;
      width: auto;
      max-width: none;
    }
  }
</style>
</head>

<body>

<!-- Toon de afbeelding als poortscherm als er geen toegang is -->
<div id="gate" class="gate">
  <img src="/pages/PWA.png" alt="native app only available in apple app store and google play store" loading="eager" decoding="async">
</div>

<main class="reader" id="reader" aria-label="Recenter.ing full reader"></main>

<script>
  if ('scrollRestoration' in history) {
    history.scrollRestoration = 'manual';
  }

  const params = new URLSearchParams(window.location.search);
  if (params.get('key') === 'nil_access_2026') {
    localStorage.setItem('nil_access', 'true');
  }

  const hasAccess = localStorage.getItem('nil_access') === 'true';
  const gate = document.getElementById('gate');
  const reader = document.getElementById('reader');

  const GIFT_LINK = "https://buy.stripe.com/00weVc0UU2jj3KU4rq28801";

  if (hasAccess) {
    gate.classList.add('hidden');
    initReader();
  }

  async function checkPageExists(pageNumber) {
    const num = String(pageNumber).padStart(3, '0');
    try {
      const response = await fetch(`/pages/${num}PWA.png`, { method: 'HEAD' });
      return response.ok;
    } catch {
      return false;
    }
  }

  async function initReader() {
    reader.innerHTML = '';
    
    // 1. Pagina 001PWA komt altijd vast als eerste
    appendPage(1, 0, true);

    // 2. Ontdek dynamisch welke pagina's er vanaf nummer 2 bestaan
    let availablePages = [];
    let i = 2;
    let consecutiveMissing = 0;

    while (true) {
      const exists = await checkPageExists(i);
      if (exists) {
        availablePages.push(i);
        consecutiveMissing = 0;
      } else {
        consecutiveMissing++;
        if (consecutiveMissing >= 3) break;
      }
      i++;
      if (i > 200) break;
    }

    // 3. Schud de resterende pagina's willekeurig door elkaar
    for (let j = availablePages.length - 1; j > 0; j--) {
      const rand = Math.floor(Math.random() * (j + 1));
      [availablePages[j], availablePages[rand]] = [availablePages[rand], availablePages[j]];
    }

    // 4. Bouw de willekeurige pagina's op
    availablePages.forEach((pageNumber, index) => {
      const isLast = (index === availablePages.length - 1);
      appendPage(pageNumber, index + 1, false, isLast);
    });
    
    reader.scrollTop = 0;
  }

  function appendPage(pageNumber, index, isFirst = false, isLast = false) {
    const num = String(pageNumber).padStart(3, '0');
    const section = document.createElement('section');
    section.className = 'page';
    section.id = `page-${index + 1}`;
    section.setAttribute('aria-label', `Page ${pageNumber}`);

    const img = document.createElement('img');
    img.src = `/pages/${num}PWA.png`;
    img.alt = `Recenter.ing page ${pageNumber}`;
    img.loading = index < 3 ? 'eager' : 'lazy';
    img.decoding = 'async';
    
    section.appendChild(img);

    if (isLast) {
      const link = document.createElement('a');
      link.href = GIFT_LINK;
      link.className = 'gift-link';
      link.setAttribute('aria-label', 'Share Recenter.ing as a friend gift');
      section.appendChild(link);
    }

    reader.appendChild(section);
  }

  function getCurrentIndex() {
    const pages = document.querySelectorAll('.page');
    if (!pages.length) return 0;
    const scrollTop = reader.scrollTop;
    let closestIndex = 0;
    let minDistance = Infinity;

    pages.forEach((page, index) => {
      const distance = Math.abs(page.offsetTop - scrollTop);
      if (distance < minDistance) {
        minDistance = distance;
        closestIndex = index;
      }
    });
    return closestIndex;
  }

  window.addEventListener('keydown', (e) => {
    if (!hasAccess) return;
    const pages = document.querySelectorAll('.page');
    if (!pages.length) return;

    if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ' || e.key === 'ArrowRight') {
      e.preventDefault();
      const nextIndex = Math.min(pages.length - 1, getCurrentIndex() + 1);
      pages[nextIndex].scrollIntoView({ behavior: 'smooth' });
    } else if (e.key === 'ArrowUp' || e.key === 'PageUp' || e.key === 'ArrowLeft') {
      e.preventDefault();
      const prevIndex = Math.max(0, getCurrentIndex() - 1);
      pages[prevIndex].scrollIntoView({ behavior: 'smooth' });
    } else if (e.key.toLowerCase() === 'r') {
      e.preventDefault();
      const randomIndex = Math.floor(Math.random() * pages.length);
      pages[randomIndex].scrollIntoView({ behavior: 'smooth' });
    }
  });

  let tapCount = 0;
  let tapTimer = null;

  document.addEventListener("pointerdown", function () {
    tapCount++;
    clearTimeout(tapTimer);

    if (tapCount >= 3) {
      tapCount = 0;
      window.location.href = "/privacy";
    } else {
      tapTimer = setTimeout(function () {
        tapCount = 0;
      }, 1000);
    }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
