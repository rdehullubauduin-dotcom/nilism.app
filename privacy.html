<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="nilism">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  :root { --bg: #ffffff; --fg: #000000; }
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
    user-select: none;
    -webkit-user-select: none;
  }

  .reader {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
  }

  .page {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease-in-out;
  }

  .page.active {
    opacity: 1;
    pointer-events: auto;
  }

  .page img {
    max-width: 110vw;
    max-height: 110dvh;
    width: auto;
    height: auto;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    display: block;
    margin: auto;
    margin-top: -4vh;
  }

  @supports (height: 100svh) {
    .page { height: 100svh; }
    .page img { max-height: 100svh; }
  }

  @media (display-mode: browser) {
    .page img {
      max-height: 100dvh;
    }
  }
</style>
</head>

<body>

<main class="reader" id="reader" aria-label="Privacy reader"></main>

<script>
  const reader = document.getElementById('reader');

  function initPrivacyPage() {
    reader.innerHTML = '';

    const section = document.createElement('section');
    section.className = 'page active';
    section.setAttribute('aria-label', '000PWA page');

    const img = document.createElement('img');
    img.src = '/pages/000PWA.png';
    img.alt = 'Privacy PWA';
    img.loading = 'eager';
    img.decoding = 'async';
    
    section.appendChild(img);
    reader.appendChild(section);
  }

  // Klik of tik ergens om terug te gaan naar de hoofdindex
  document.addEventListener("pointerup", function () {
    window.location.href = '/';
  });

  window.addEventListener('keydown', (e) => {
    if (['Escape', 'ArrowLeft', 'ArrowUp', ' ', 'ArrowRight', 'ArrowDown', 'Enter'].includes(e.key)) {
      e.preventDefault();
      window.location.href = '/';
    }
  });

  initPrivacyPage();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
