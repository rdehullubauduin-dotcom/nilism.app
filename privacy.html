<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Privacy — nilism</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="nilism">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  :root { --bg: #ffffff; --fg: #000000; }
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
    user-select: none;
    -webkit-user-select: none;
  }

  .reader {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
  }

  .page {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: #fff;
    opacity: 1;
  }

  .page img {
    max-width: 100vw;
    max-height: 100dvh;
    width: auto;
    height: auto;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    display: block;
    margin: auto;
    margin-top: -4vh;
  }

  .back-area {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 999;
    cursor: pointer;
  }

  @supports (height: 100svh) {
    .page { height: 100svh; }
    .page img { max-height: 100svh; }
  }

  @media (display-mode: browser) {
    .page img {
      max-height: 100dvh;
    }
  }
</style>
</head>

<body>

<main class="reader" id="reader" aria-label="Privacy reader">
  <section class="page active" aria-label="000PWA page">
    <img src="/pages/000PWA.png" alt="Privacy PWA" loading="eager" decoding="async">
    <div class="back-area" onclick="window.location.href='/'" title="Back to main"></div>
  </section>
</main>

<script>
  window.addEventListener('keydown', (e) => {
    if (['Escape', 'ArrowLeft', 'ArrowUp', ' '].includes(e.key)) {
      e.preventDefault();
      window.location.href = '/';
    }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
